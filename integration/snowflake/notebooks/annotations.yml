tables:
  - name: customers
    description: Customer overview data mart, offering key details for each unique customer. One row per customer.
    columns:
      - name: customer_id
        description: The unique key of the orders mart.
      - name: customer_name
        description: Customers' full name.
      - name: count_lifetime_orders
        description: Total number of orders a customer has ever placed.
      - name: first_ordered_at
        description: The timestamp when a customer placed their first order.
      - name: last_ordered_at
        description: The timestamp of a customer's most recent order.
      - name: lifetime_spend_pretax
        description: The sum of all the pre-tax subtotals of every order a customer has placed.
      - name: lifetime_tax_paid
        description: The sum of all the tax portion of every order a customer has placed.
      - name: lifetime_spend
        description: The sum of all the order totals (including tax) that a customer has ever placed.
      - name: customer_type
        description:
          Options are 'new' or 'returning', indicating if a customer has ordered more than once or has only placed
          their first order to date.
  - name: order_items
    description: null
    columns:
      - name: order_item_id
        description: null
      - name: order_id
        description: null
  - name: orders
    description:
      Order overview data mart, offering key details for each order inlcluding if it's a customer's first order and
      a food vs. drink item breakdown. One row per order.
    columns:
      - name: order_id
        description: The unique key of the orders mart.
      - name: customer_id
        description: The foreign key relating to the customer who placed the order.
      - name: order_total
        description: The total amount of the order in USD including tax.
      - name: ordered_at
        description: The timestamp the order was placed at.
      - name: order_cost
        description: The sum of supply expenses to fulfill the order.
      - name: is_food_order
        description: A boolean indicating if this order included any food items.
      - name: is_drink_order
        description: A boolean indicating if this order included any drink items.
  - name: raw_customers
    description: One record per person who has purchased one or more items
  - name: raw_orders
    snowflake_fqn: RAW.ORDERS
    type: TABLE
    role: peripheral
    description: One record per order (consisting of one or more order items)
  - name: raw_items
    description: Items included in an order
  - name: raw_stores
    description: null
  - name: raw_products
    description: One record per SKU for items sold in stores
  - name: raw_supplies
    description: One record per supply per SKU of items sold in stores
  - name: stg_customers
    description: Customer data with basic cleaning and transformation applied, one row per customer.
    columns:
      - name: customer_id
        description: The unique key for each customer.
  - name: stg_locations
    description: List of open locations with basic cleaning and transformation applied, one row per location.
    columns:
      - name: location_id
        description: The unique key for each location.
  - name: stg_order_items
    description: Individual food and drink items that make up our orders, one row per item.
    columns:
      - name: order_item_id
        description: The unique key for each order item.
      - name: order_id
        description: The corresponding order each order item belongs to
  - name: stg_orders
    description: Order data with basic cleaning and transformation applied, one row per order.
    columns:
      - name: order_id
        description: The unique key for each order.
  - name: stg_products
    description:
      Product (food and drink items that can be ordered) data with basic cleaning and transformation applied, one
      row per product.
    columns:
      - name: product_id
        description: The unique key for each product.
  - name: stg_supplies
    description:
      "List of our supply expenses data with basic cleaning and transformation applied.

      One row per supply cost, not per supply. As supply costs fluctuate they receive a new row with a new UUID. Thus there
      can be multiple rows per supply_id.

      "
    columns:
      - name: supply_uuid
        description: The unique key of our supplies per cost.
  - name: weekly_sales_by_store
    snowflake_fqn: PREPARED.WEEKLY_SALES_BY_STORE_WITH_TARGET
    type: VIEW
    role: population
    description: Prepared weekly sales data by store with target variable. Population table for getML weekly_sales_features pipeline. Contains store-week aggregations with NEXT_WEEK_SALES as prediction target.
  - name: getml_features
    snowflake_fqn: GETML_FS.GETML_FEATURES
    type: TABLE
    role: features
  - name: feature_metadata
    snowflake_fqn: GETML_FS.FEATURE_METADATA
    type: TABLE
    role: metadata
    description: getML feature metadata including SQL provenance for GETML_FEATURES table.
semantic_models:
  - name: customers
    defaults:
      agg_time_dimension: first_ordered_at
    description: "Customer grain mart.

      "
    model: ref('customers')
    entities:
      - name: customer
        expr: customer_id
        type: primary
    dimensions:
      - name: customer_name
        type: categorical
      - name: customer_type
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: customers
        description: Count of unique customers
        agg: count_distinct
        expr: customer_id
      - name: count_lifetime_orders
        description: Total count of orders per customer.
        agg: sum
      - name: lifetime_spend_pretax
        description: Customer lifetime spend before taxes.
        agg: sum
      - name: lifetime_spend
        agg: sum
        description: Gross customer lifetime spend inclusive of taxes.
  - name: locations
    description:
      "Location dimension table. The grain of the table is one row per location.

      "
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: opened_date
        expr: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate
        description: Average tax rate.
        expr: tax_rate
        agg: average
  - name: order_item
    defaults:
      agg_time_dimension: ordered_at
    description:
      "Items contatined in each order. The grain of the table is one row per order item.

      "
    model: ref('order_items')
    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order_id
        type: foreign
        expr: order_id
      - name: product
        type: foreign
        expr: product_id
    dimensions:
      - name: ordered_at
        expr: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: is_food_item
        type: categorical
      - name: is_drink_item
        type: categorical
    measures:
      - name: revenue
        description:
          The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each
          product in an order.
        agg: sum
        expr: product_price
      - name: food_revenue
        description:
          The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each
          product in an order.
        agg: sum
        expr: case when is_food_item then product_price else 0 end
      - name: drink_revenue
        description:
          The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each
          product in an order.
        agg: sum
        expr: case when is_drink_item then product_price else 0 end
      - name: median_revenue
        description: The median revenue generated for each order item.
        agg: median
        expr: product_price
  - name: orders
    defaults:
      agg_time_dimension: ordered_at
    description:
      "Order fact table. This table is at the order grain with one row per order.

      "
    model: ref('orders')
    entities:
      - name: order_id
        type: primary
      - name: location
        type: foreign
        expr: location_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: ordered_at
        expr: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: order_total_dim
        type: categorical
        expr: order_total
      - name: is_food_order
        type: categorical
      - name: is_drink_order
        type: categorical
      - name: customer_order_number
        type: categorical
    measures:
      - name: order_total
        description: The total amount for each order including taxes.
        agg: sum
      - name: order_count
        expr: 1
        agg: sum
      - name: tax_paid
        description: The total tax paid on each order.
        agg: sum
      - name: order_cost
        description: The cost for each order item. Cost is calculated as a sum of the supply cost for each order item.
        agg: sum
  - name: products
    description:
      "Product dimension table. The grain of the table is one row per product.

      "
    model: ref('products')
    entities:
      - name: product
        type: primary
        expr: product_id
    dimensions:
      - name: product_name
        type: categorical
      - name: product_type
        type: categorical
      - name: product_description
        type: categorical
      - name: is_food_item
        type: categorical
      - name: is_drink_item
        type: categorical
      - name: product_price
        type: categorical
  - name: supplies
    description:
      "Supplies dimension table. The grain of the table is one row per supply and product combination.

      "
    model: ref('supplies')
    entities:
      - name: supply
        type: primary
        expr: supply_uuid
    dimensions:
      - name: supply_id
        type: categorical
      - name: product_id
        type: categorical
      - name: supply_name
        type: categorical
      - name: supply_cost
        type: categorical
      - name: is_perishable_supply
        type: categorical
metrics:
  - name: lifetime_spend_pretax
    description: Customer's lifetime spend before tax
    label: LTV Pre-tax
    type: simple
    type_params:
      measure: lifetime_spend_pretax
  - name: count_lifetime_orders
    description: Count of lifetime orders
    label: Count Lifetime Orders
    type: simple
    type_params:
      measure: count_lifetime_orders
  - name: average_order_value
    description: LTV pre-tax / number of orders
    label: Average Order Value
    type: derived
    type_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
      expr: lifetime_spend_pretax / count_lifetime_orders
  - name: revenue
    description: Sum of the product revenue for each order item. Excludes tax.
    type: simple
    label: Revenue
    type_params:
      measure: revenue
  - name: order_cost
    description: Sum of cost for each order item.
    label: Order Cost
    type: simple
    type_params:
      measure: order_cost
  - name: median_revenue
    description: The median revenue for each order item. Excludes tax.
    type: simple
    label: Median Revenue
    type_params:
      measure: median_revenue
  - name: food_revenue
    description: The revenue from food in each order
    label: Food Revenue
    type: simple
    type_params:
      measure: food_revenue
  - name: drink_revenue
    description: The revenue from drinks in each order
    label: Drink Revenue
    type: simple
    type_params:
      measure: drink_revenue
  - name: food_revenue_pct
    description: The % of order revenue from food.
    label: Food Revenue %
    type: ratio
    type_params:
      numerator: food_revenue
      denominator: revenue
  - name: drink_revenue_pct
    description: The % of order revenue from drinks.
    label: Drink Revenue %
    type: ratio
    type_params:
      numerator: drink_revenue
      denominator: revenue
  - name: revenue_growth_mom
    description: Percentage growth of revenue compared to 1 month ago. Excluded tax
    type: derived
    label: Revenue Growth % M/M
    type_params:
      expr: (current_revenue - revenue_prev_month)*100/revenue_prev_month
      metrics:
        - name: revenue
          alias: current_revenue
        - name: revenue
          offset_window: 1 month
          alias: revenue_prev_month
  - name: order_gross_profit
    description: Gross profit from each order.
    type: derived
    label: Order Gross Profit
    type_params:
      expr: revenue - cost
      metrics:
        - name: revenue
        - name: order_cost
          alias: cost
  - name: cumulative_revenue
    description: The cumulative revenue for all orders.
    label: Cumulative Revenue (All Time)
    type: cumulative
    type_params:
      measure: revenue
  - name: order_total
    description: Sum of total order amonunt. Includes tax + revenue.
    type: simple
    label: Order Total
    type_params:
      measure: order_total
  - name: new_customer_orders
    description: New customer's first order count
    label: New Customers
    type: simple
    type_params:
      measure: order_count
    filter: "{{ Dimension('order_id__customer_order_number') }} = 1

      "
  - name: large_orders
    description: Count of orders with order total over 20.
    type: simple
    label: Large Orders
    type_params:
      measure: order_count
    filter: "{{ Dimension('order_id__order_total_dim') }} >= 20

      "
  - name: orders
    description: Count of orders.
    label: Orders
    type: simple
    type_params:
      measure: order_count
  - name: food_orders
    description: Count of orders that contain food order items
    label: Food Orders
    type: simple
    type_params:
      measure: order_count
    filter: "{{ Dimension('order_id__is_food_order') }} = true

      "
  - name: drink_orders
    description: Count of orders that contain drink order items
    label: Drink Orders
    type: simple
    type_params:
      measure: order_count
    filter: "{{ Dimension('order_id__is_drink_order') }} = true

      "
saved_queries:
  - name: customer_order_metrics
    query_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
        - average_order_value
      group_by:
        - Entity('customer')
    exports:
      - name: customer_order_metrics
        config:
          export_as: table
  - name: revenue_metrics
    query_params:
      metrics:
        - revenue
        - food_revenue
        - drink_revenue
      group_by:
        - TimeDimension('metric_time', 'day')
    exports:
      - name: revenue_metrics
        config:
          export_as: table
  - name: order_metrics
    query_params:
      metrics:
        - orders
        - new_customer_orders
        - order_total
        - food_orders
        - drink_orders
      group_by:
        - TimeDimension('metric_time', 'day')
    exports:
      - name: order_metrics
        config:
          export_as: table
