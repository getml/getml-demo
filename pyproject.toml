[project]
name = "getml-demo"
version = "0.1.0"
description = "Jupyter Notebooks demonstrating getML capabilities for machine learning on relational datasets"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "jupyterlab==4.1.1",
    "getml==1.5.1",
    "featuretools==1.31.0",
    "tsfresh==0.20.3",
    "seaborn==0.13.2",
    "ipywidgets==8.1.2",
    "plotly==5.18.0",
    "prophet==1.1.5",
    "matplotlib==3.8.2",
]

[dependency-groups]
spark = [
    "pyspark==4.0.1",
]

databricks = [
    "databricks-connect==17.3.2",
    "requests==2.32.5",
    "pydantic==2.11.7",
    "sqlglot==28.4.1",
    "getml-interpretations",
]

dev = [
    "basedpyright>=1.36.1",
    "jupytext>=1.18.1",
    "ruff>=0.14.9",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.uv.sources]
getml-interpretations = { path = "../getml-interpretations", editable = true }
